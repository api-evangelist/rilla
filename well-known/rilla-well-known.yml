note: >-
  app.rilla.com serves a real RFC 9116 security.txt (HTTP 200, text/plain, 242 bytes)
  — the only .well-known document Rilla publishes anywhere. Every other path on that
  host answers HTTP 200 with the 3,686-byte single-page-app HTML shell, which is NOT a
  document and is recorded here as a miss. www.rilla.com and the API hosts return real
  404s. api.apirilla.com is an AWS API Gateway that answers every path with 403
  "Missing Authentication Token", so nothing there could be read anonymously.
