name: Rilla
description: 'Rilla is an AI conversation-intelligence and coaching platform built for in-person
  and outside sales teams. Reps record their face-to-face customer conversations, and Rilla
  transcribes and analyzes them so managers can run virtual "ridealongs" and deliver targeted,
  data-driven coaching at scale. The platform surfaces talk patterns, objection handling, and
  outcome analytics across thousands of field conversations to help teams raise close rates,
  increase ticket size, and speed up rep ramp. Rilla is a GV (Google Ventures) portfolio company
  in the AI sector. Rilla runs a real production API — api.rillavoice.com/api/v1/, the private backend
  of its web and mobile apps, which answers every path with 401 Invalid Token — plus an AWS API Gateway
  webhook receiver its partner SPOTIO documents, but it publishes no developer portal, reference, SDK,
  or machine-readable specification of any kind, and its CRM integrations are delivered by consuming the
  Merge unified API rather than by exposing a contract. This record captures its public web identity,
  the RFC 9116 security.txt it serves from app.rilla.com, and live domain-security and well-known probes.'
